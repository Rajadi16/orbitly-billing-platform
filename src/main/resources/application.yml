spring:
  application:
    name: orbitly

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/orbitly}
    username: ${DB_USER:orbitly}
    password: ${DB_PASSWORD:orbitly}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all                   # idempotent-safe acknowledgement
      properties:
        enable.idempotence: true
        retries: 3
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: orbitly-billing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false   # manual ack for idempotent processing
    listener:
      ack-mode: MANUAL_IMMEDIATE

server:
  port: 8080

# App-level config
orbitly:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000       # 24 h
  stripe:
    api-key: ${STRIPE_API_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  kafka:
    topic:
      billing-events: billing-events

logging:
  level:
    com.orbitly: DEBUG
    org.springframework.kafka: INFO
